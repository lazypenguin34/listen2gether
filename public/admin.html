<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<div>
    <h1>listen2gether admin panel</h1>

    <h2>spotify rooms</h2>
    <table>
        <thead>
        <tr>
            <th>room code</th>
            <th>host access token</th>
            <th>host refresh token</th>
            <th>track name</th>
            <th>position (ms)</th>
            <th>album art</th>
            <th>status</th>
        </tr>
        </thead>
        <tbody id="spotifyRoomsTable">
        <!-- Data will appear here -->
        </tbody>
    </table>

    <br>
    <h2>youtube music rooms</h2>
    <table>
        <thead>
        <tr>
            <th>room code</th>
            <th>track name</th>
            <th>position (ms)</th>
            <th>album art</th>
            <th>status</th>
        </tr>
        </thead>
        <tbody id="ytRoomsTable">
        <!-- Data will appear here -->
        </tbody>
    </table>

    <script src="admin.js"></script>
</div>
</body>
</html>
